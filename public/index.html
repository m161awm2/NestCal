<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NestCal</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #1f2933;
        background: #f6f7f9;
        font-family: Arial, 'Noto Sans KR', sans-serif;
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 18px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 16px;
        align-items: start;
      }

      .panel,
      .event {
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
      }

      .panel {
        padding: 18px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #c8d0dc;
        border-radius: 6px;
        padding: 10px;
        background: #ffffff;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        color: #ffffff;
        background: #2563eb;
        cursor: pointer;
      }

      button.secondary {
        color: #1f2933;
        background: #e8edf5;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .status {
        min-height: 20px;
        color: #475569;
        font-size: 14px;
      }

      .events {
        display: grid;
        gap: 10px;
      }

      .event {
        padding: 14px;
      }

      .event-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-weight: 700;
      }

      .event-meta {
        margin-top: 6px;
        color: #64748b;
        font-size: 13px;
      }

      .event-content {
        margin: 10px 0 0;
        white-space: pre-wrap;
      }

      @media (max-width: 760px) {
        header,
        .layout {
          display: grid;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>NestCal</h1>
          <p class="status" id="sessionStatus">로그인이 필요합니다.</p>
        </div>
        <button class="secondary" id="refreshButton" type="button">
          새로고침
        </button>
      </header>

      <section class="layout">
        <div class="stack">
          <form class="panel stack" id="authForm">
            <h2>계정</h2>
            <label>
              닉네임
              <input id="nickname" name="nickname" maxlength="20" required />
            </label>
            <label>
              비밀번호
              <input id="password" name="password" type="password" required />
            </label>
            <div class="actions">
              <button id="loginButton" type="submit">로그인</button>
              <button class="secondary" id="registerButton" type="button">
                가입
              </button>
            </div>
          </form>

          <form class="panel stack" id="eventForm">
            <h2>일정 추가</h2>
            <label>
              월
              <input
                id="month"
                name="month"
                type="number"
                min="1"
                max="12"
                required
              />
            </label>
            <label>
              일
              <input
                id="day"
                name="day"
                type="number"
                min="1"
                max="31"
                required
              />
            </label>
            <label>
              제목
              <input id="title" name="title" maxlength="100" required />
            </label>
            <label>
              내용
              <textarea id="content" name="content"></textarea>
            </label>
            <button type="submit">저장</button>
          </form>
        </div>

        <section class="panel stack">
          <h2>일정 목록</h2>
          <div class="events" id="events"></div>
        </section>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
